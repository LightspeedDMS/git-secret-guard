name: platforms

# Real-platform runs on disposable hosted runners (docs/platforms.md#ci-on-real-platforms).
# Not part of tests.yml and not a required check: nothing here runs on pull_request.
# REMOVE BEFORE MERGE: the push trigger below exists only so the branch ci/real-platform-runs can run this file.
on:
  push:
    branches: [ci/real-platform-runs]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  facts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          set +e
          mkdir -p "$RUNNER_TEMP/logs"
          {
            podman --version; id; cat /etc/subuid; ls -l /dev/kvm; nproc; free -m
            podman info --format '{{.Host.OCIRuntime.Name}} {{.Host.CgroupManager}} {{.Host.Security.Rootless}} {{.Store.GraphDriverName}}'
            uname -r
          } >"$RUNNER_TEMP/logs/facts.txt" 2>&1
          cat "$RUNNER_TEMP/logs/facts.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: facts
          path: ${{ runner.temp }}/logs

  containers:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[heavy]')
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04, debian-13]
        run: [upgrade, default]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # upgrade = the real install --upgrade-git E2E; default = the launcher's own phases (prepare, install E2E, tests/run.sh)
      - name: ubuntu.sh in a podman container
        env:
          OS: ${{ matrix.os }}
          RUN: ${{ matrix.run }}
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          set -o pipefail
          args=()
          if [ "$RUN" = upgrade ]; then args=(--phase upgrade); fi
          bash tests/platform/ubuntu.sh --os "$OS" "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/logs/$OS-$RUN.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: containers-${{ matrix.os }}-${{ matrix.run }}
          path: ${{ runner.temp }}/logs

  rpm:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[heavy]')
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: rocky, distro: rocky, args: "" }
          - { name: fedora, distro: fedora, args: "" }
          # the "needs a real machine" items of #40 that a container can show (docs/platforms.md#ci-on-real-platforms)
          - { name: rocky-root, distro: rocky, args: "--phase upgrade-root" }
          - { name: rocky-password, distro: rocky, args: "--phase upgrade-password" }
          - { name: rocky-bump, distro: rocky, args: "--phase upgrade-bump" }
          - { name: rocky-offline, distro: rocky, args: "--offline-restore" }
          - { name: fedora-old, distro: fedora, args: "--phase upgrade-old" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: rpm.sh in a podman container
        env:
          DISTRO: ${{ matrix.distro }}
          NAME: ${{ matrix.name }}
          ARGS: ${{ matrix.args }}
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          set -o pipefail
          # shellcheck disable=SC2086
          bash tests/platform/rpm.sh "$DISTRO" $ARGS 2>&1 | tee "$RUNNER_TEMP/logs/$NAME.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rpm-${{ matrix.name }}
          path: ${{ runner.temp }}/logs

  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: mounts and devices of a default podman container
        run: |
          set +e
          ph="$(mktemp -d)"; mkdir -p "$ph/.config/containers" "$ph/hooks.d"; : >"$ph/.config/containers/mounts.conf"
          printf '[engine]\nhooks_dir = ["%s"]\n' "$ph/hooks.d" >"$ph/containers.conf"
          P=(env -i HOME="$ph" PATH="$PATH" XDG_RUNTIME_DIR=/run/user/$(id -u) XDG_DATA_HOME="$HOME/.local/share" XDG_CONFIG_HOME="$ph/.config" CONTAINERS_CONF="$ph/containers.conf" LANG=C.UTF-8)
          img=docker.io/library/ubuntu:24.04@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852
          "${P[@]}" podman pull -q $img
          "${P[@]}" podman run --name diag --init --pull=never --http-proxy=false $img bash -c '
            echo "--- mountinfo (mountpoint fstype)"; while read -r _ _ _ _ mp _ rest; do echo "$mp ${rest#* - }" | cut -d" " -f1,2; done </proc/self/mountinfo
            echo "--- dev"; find /dev -mindepth 1 -maxdepth 4 -printf "%P\n" | sort'
          echo "--- spec"
          cfg="$HOME/.local/share/containers/storage/overlay-containers/$("${P[@]}" podman inspect -f '{{.Id}}' diag)/userdata/config.json"
          jq -c '{masked:.linux.maskedPaths, ro:.linux.readonlyPaths, mounts:[.mounts[]|{d:.destination,t:.type}]}' "$cfg"

  # the launcher and container-script unit tests (tests/test_platform.sh skips off Linux); a failure here is evidence for the baselines
  platform-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prerequisites of docs/platforms.md
        run: |
          sudo add-apt-repository -y ppa:git-core/ppa
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git jq curl ca-certificates gawk mawk dbus systemd pre-commit pipx
          sudo update-alternatives --set awk /usr/bin/mawk
          pipx install shellcheck-py==0.11.0.1
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
          echo "GSG_TEST_GIT=$(command -v git)" >>"$GITHUB_ENV"
          echo "GSG_TEST_SHELLCHECK=$HOME/.local/bin/shellcheck" >>"$GITHUB_ENV"
      - name: the platform launcher tests
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          set -o pipefail
          bash tests/run.sh tests/test_platform.sh tests/test_mac_runner.sh tests/test_platform_rpm.sh tests/test_platform_vm.sh 2>&1 | tee "$RUNNER_TEMP/logs/platform-unit.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: platform-unit
          path: ${{ runner.temp }}/logs

  # #40: does a commit made by a git below 2.54 skip the scan? A real old git (built from the pinned tarball) and the git inside GitHub Desktop's .deb.
  old-git:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[heavy]')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build git 2.45.3 from the pinned tarball
        env:
          OLD_VERSION: 2.45.3
          OLD_SHA256: 38f20f95a1427c42b4990f2ac677e558fe4384301b9964e161dd4b448315aebd
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libcurl4-openssl-dev libssl-dev libexpat1-dev zlib1g-dev
          mkdir -p "$RUNNER_TEMP/build" "$RUNNER_TEMP/logs"
          cd "$RUNNER_TEMP/build"
          curl -fsSL -o git.tar.xz "https://www.kernel.org/pub/software/scm/git/git-$OLD_VERSION.tar.xz"
          printf '%s  git.tar.xz\n' "$OLD_SHA256" | sha256sum -c -
          tar -xf git.tar.xz
          make -C "git-$OLD_VERSION" -j "$(nproc)" prefix="$RUNNER_TEMP/oldgit" NO_GETTEXT=1 NO_TCLTK=1 NO_RUST=1 all
          make -C "git-$OLD_VERSION" prefix="$RUNNER_TEMP/oldgit" NO_GETTEXT=1 NO_TCLTK=1 NO_RUST=1 install
          "$RUNNER_TEMP/oldgit/bin/git" --version
      - name: A commit made by git 2.45.3
        run: |
          set -o pipefail
          bash tests/platform/old-git-e2e.sh "$RUNNER_TEMP/oldgit/bin/git" "git 2.45.3 built from source" 2>&1 | tee "$RUNNER_TEMP/logs/old-git-built.log"
      - name: Fetch the GitHub Desktop .deb
        env:
          DESKTOP_URL: https://github.com/shiftkey/desktop/releases/download/release-3.4.13-linux1/GitHubDesktop-linux-amd64-3.4.13-linux1.deb
          DESKTOP_SHA256: ""
        run: |
          mkdir -p "$RUNNER_TEMP/desktop"
          curl -fsSL -o "$RUNNER_TEMP/desktop.deb" "$DESKTOP_URL"
          sum="$(sha256sum "$RUNNER_TEMP/desktop.deb" | cut -d' ' -f1)"
          echo "sha256 of the .deb: $sum" | tee "$RUNNER_TEMP/logs/desktop-deb.txt"
          if [ -n "$DESKTOP_SHA256" ] && [ "$sum" != "$DESKTOP_SHA256" ]; then echo "::error::the .deb does not match its pinned digest"; exit 1; fi
          dpkg-deb -x "$RUNNER_TEMP/desktop.deb" "$RUNNER_TEMP/desktop"
          find "$RUNNER_TEMP/desktop" -path '*app/git/bin/git' -o -path '*app/git/libexec/git-core/git' | tee -a "$RUNNER_TEMP/logs/desktop-deb.txt"
      - name: A commit made by the git GitHub Desktop bundles
        run: |
          set -o pipefail
          g="$(find "$RUNNER_TEMP/desktop" -path '*app/git/bin/git' | head -n 1)"
          "$g" --version
          bash tests/platform/old-git-e2e.sh "$g" "the git bundled in GitHub Desktop 3.4.13" 2>&1 | tee "$RUNNER_TEMP/logs/old-git-desktop.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: old-git
          path: ${{ runner.temp }}/logs

  # #40: Rocky 9 with SELinux enforcing, as a real VM. Hosted x64 runners expose /dev/kvm; without it rocky-vm.sh stops and says what TCG would cost.
  rocky-vm:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[heavy]')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: KVM and qemu
        run: |
          ls -l /dev/kvm || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils openssh-client
          qemu-system-x86_64 --version | head -n 1
      - name: Boot the Rocky 9 image and run the E2E
        env:
          GSG_VM_LOGDIR: ${{ runner.temp }}/logs
        run: |
          mkdir -p "$GSG_VM_LOGDIR"
          set -o pipefail
          bash tests/platform/rocky-vm.sh 2>&1 | tee "$GSG_VM_LOGDIR/launcher.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rocky-vm
          path: ${{ runner.temp }}/logs
