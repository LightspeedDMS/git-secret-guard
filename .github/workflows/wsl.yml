name: wsl

# Real WSL checks on a disposable GitHub-hosted Windows runner (story #31). It never runs on a pull request and never blocks one.
# tests/platform/wsl-ci.sh holds the scenarios and refuses to run unless GITHUB_ACTIONS is set, so it cannot run on a developer machine.
# It runs only when started by hand: Actions, wsl, Run workflow (or gh workflow run wsl.yml --ref BRANCH -f distribution=NAME).
on:
  workflow_dispatch:
    inputs:
      distribution:
        description: Ubuntu comes from setup-wsl; Rocky-9 and Fedora-44 are the vendor WSL images, imported with wsl --import and checked against a pinned SHA-256
        type: choice
        default: Ubuntu-22.04
        options:
          - Ubuntu-22.04
          - Ubuntu-24.04
          - Rocky-9
          - Fedora-44
      consent:
        description: flag passes --upgrade-git; typed types y at the real prompt on a pty
        type: choice
        default: flag
        options:
          - flag
          - typed

permissions:
  contents: read

concurrency:
  group: wsl-${{ github.ref }}-${{ inputs.distribution }}-${{ inputs.consent }}
  cancel-in-progress: true

jobs:
  wsl:
    # windows-2022 has WSL 1 enabled in the image (actions/runner-images Windows2022-Readme); both versions start there with setup-wsl (runs 42237326449 and later)
    runs-on: windows-2022
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        wsl-version: ['1', '2']
    env:
      # WSLENV carries these into the distribution; /p turns a Windows path into the /mnt path; GITHUB_ACTIONS is the guard of wsl-ci.sh
      WSLENV: GITHUB_ACTIONS:CONSENT:WS/p:MAIN/p:LOGS/p
      WS: ${{ github.workspace }}
      MAIN: ${{ github.workspace }}\main-src
      LOGS: ${{ github.workspace }}\wsl-logs
      DISTRIBUTION: ${{ inputs.distribution || 'Ubuntu-22.04' }}
      CONSENT: ${{ inputs.consent || 'flag' }}
      # the distribution every phase runs in: the Ubuntu setup-wsl installs, or the imported RPM image
      WSL_TARGET: ${{ startsWith(inputs.distribution, 'Ubuntu') && inputs.distribution || (inputs.distribution && 'RPM' || 'Ubuntu-22.04') }}
    steps:
      # actions/checkout v4, pinned by commit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      # main is checked out beside the branch: its installed CLI is the unfixed code the installed-cli phase runs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          path: main-src
          persist-credentials: false

      # Vampire/setup-wsl v7.2.0, pinned by commit; git is the stock package of the distribution on purpose (2.34 on 22.04, 2.43 on 24.04).
      # For Rocky and Fedora it only enables the WSL platform (it offers no RPM distribution); an Ubuntu is installed and not used.
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4
        with:
          distribution: ${{ startsWith(inputs.distribution, 'Ubuntu') && inputs.distribution || 'Ubuntu-22.04' }}
          wsl-version: ${{ matrix.wsl-version }}
          additional-packages: sudo jq curl ca-certificates git

      # The vendor WSL tar of each RPM distribution, from the vendor's mirror; the SHA-256 is the one in the vendor's own CHECKSUM file and a mismatch stops the job
      - name: Import the RPM distribution
        if: ${{ !startsWith(inputs.distribution, 'Ubuntu') && inputs.distribution }}
        shell: pwsh
        env:
          WSLV: ${{ matrix.wsl-version }}
        run: |
          $ErrorActionPreference = 'Stop'
          switch ($env:DISTRIBUTION) {
            'Rocky-9' {
              $url = 'https://dl.rockylinux.org/pub/rocky/9/images/x86_64/Rocky-9-WSL-Base-9.8-20260525.0.x86_64.wsl'
              $sha = '58de2455cd475abbaa3cef0f9d240f405c379b5a54d3826f9b55cc41e3829221'
            }
            'Fedora-44' {
              $url = 'https://dl.fedoraproject.org/pub/fedora/linux/releases/44/Container/x86_64/images/Fedora-WSL-Base-44-1.7.x86_64.wsl'
              $sha = '2e5b153ba4b639952bf546be577fc19b832fe8944caa7de342b32f10da7d319a'
            }
            default { throw "no image is pinned for $env:DISTRIBUTION" }
          }
          $file = Join-Path $env:RUNNER_TEMP 'rootfs.wsl'
          curl.exe -fsSL --retry 3 -o $file $url
          if ($LASTEXITCODE -ne 0) { throw "download failed ($LASTEXITCODE)" }
          $got = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLower()
          if ($got -ne $sha) { throw "SHA-256 mismatch for $url : got $got, pinned $sha" }
          "SHA-256 of $url is $got (pinned)"
          $dir = Join-Path $env:RUNNER_TEMP 'wsl-rpm'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          wsl.exe --import $env:WSL_TARGET $dir $file --version $env:WSLV
          if ($LASTEXITCODE -ne 0) { throw "wsl --import failed ($LASTEXITCODE)" }
          wsl.exe --list --verbose

      - name: A normal user with sudo, as a developer has
        shell: pwsh
        run: ./tests/platform/wsl-phase.ps1 -Phase prepare -User root

      - name: Facts of this machine
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./tests/platform/wsl-phase.ps1 -Phase facts

      - name: Typed No, then install with the chosen consent, blocked commit, rerun, timer refusal
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./tests/platform/wsl-phase.ps1 -Phase upgrade

      # The runner mounts the drive for root; a developer's mount carries their own uid. Root remounts it for the test user here, and the next step runs as that user.
      - name: Mount /mnt/c for the test user
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./tests/platform/wsl-phase.ps1 -Phase mount-for-user -User root

      - name: Repository and checkout under /mnt/c
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./tests/platform/wsl-phase.ps1 -Phase mntc

      - name: Mount /mnt/c with metadata
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./tests/platform/wsl-phase.ps1 -Phase mount-for-user -User root -PhaseArg metadata

      - name: Repository and checkout under /mnt/c with metadata
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./tests/platform/wsl-phase.ps1 -Phase mntc -PhaseArg metadata

      # The logs so far are written down before the test files, the rename probe and the installed-CLI install run: the probe renames a directory holding a running script, which is
      # the operation that coincided with the first blue screen of the maintainer's WSL 1 host, so it goes last and nothing earlier depends on it surviving.
      - name: Results so far in the job summary
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $f = Join-Path $env:LOGS 'results.txt'
          "### WSL ${{ matrix.wsl-version }}, $env:DISTRIBUTION, consent $env:CONSENT, before the test files and the rename probe" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if (Test-Path $f) {
            '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            Get-Content $f | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          } else { 'no results file was written' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY }

      # actions/upload-artifact v4, pinned by commit
      - name: Logs so far
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wsl-${{ inputs.distribution || 'Ubuntu-22.04' }}-${{ inputs.consent || 'flag' }}-${{ matrix.wsl-version }}-logs-before-tests
          path: ${{ github.workspace }}\wsl-logs
          if-no-files-found: warn

      # After the first upload on purpose: the suite includes test_install, whose in-place test renames the directory of a running script under the plain-kernel pin. It skips itself on real WSL 1
      # and its WSL 1 twin runs the pinned path. A failure of the suite on WSL 1 is recorded, not hidden.
      - name: Test files that apply (GSG_TEST_JOBS=1)
        if: ${{ !cancelled() }}
        timeout-minutes: 75
        shell: pwsh
        run: ./tests/platform/wsl-phase.ps1 -Phase tests

      - name: Rename probe (the installed-CLI mv error)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./tests/platform/wsl-phase.ps1 -Phase probe

      - name: Install from the installed CLI (main, then this branch)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./tests/platform/wsl-phase.ps1 -Phase installed-cli

      - name: Results in the job summary
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $f = Join-Path $env:LOGS 'results.txt'
          "### WSL ${{ matrix.wsl-version }}, $env:DISTRIBUTION, consent $env:CONSENT, all phases" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if (Test-Path $f) {
            '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            Get-Content $f | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          } else { 'no results file was written' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY }

      - name: Logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wsl-${{ inputs.distribution || 'Ubuntu-22.04' }}-${{ inputs.consent || 'flag' }}-${{ matrix.wsl-version }}-logs
          path: ${{ github.workspace }}\wsl-logs
          if-no-files-found: warn
